<!doctype html><html><head><meta charset="utf-8">
<script src="kit/gsap.min.js"></script><script src="kit/sk.js"></script>
<style>*{margin:0}body{width:1080px;height:1920px;overflow:hidden;background:#F6F3EA}text{font-family:"Hannotate SC"}</style></head><body>
<svg id="sv" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs><mask id="am" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920"><path id="amp" d="M432 540 C350 586 302 700 300 850" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round"/></mask></defs>
<g id="world">
<!-- 钱袋 -->
<g id="bag">
 <path d="M468 344 C420 372 392 446 404 500 C414 548 470 566 540 566 C612 566 666 548 676 498 C688 444 660 372 612 344 Z" fill="#F6F3EA"/>
 <path d="M470 352 C428 380 404 446 414 498 C420 528 438 546 462 556 Z" fill="url(#hatch)" opacity=".45" filter="url(#pencil)"/>
 <g filter="url(#pencil)" fill="none" stroke="#3E3C38" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
  <path d="M468 344 C420 372 392 446 404 500 C414 548 470 566 540 566 C612 566 666 548 676 498 C688 444 660 372 612 344"/>
  <path d="M466 344 C500 336 580 336 614 344" stroke-width="4"/>
  <path d="M492 338 C470 300 486 276 504 294 C514 270 540 268 546 290 C556 266 588 270 584 296 C600 282 612 306 590 338" stroke-width="4"/>
 </g>
 <g filter="url(#pen)"><text x="540" y="508" text-anchor="middle" font-size="96" font-weight="700" fill="#34322E">¥</text></g>
</g>
<g filter="url(#pen)"><text id="lb0" x="708" y="454" font-size="46" font-weight="700" fill="#34322E" transform="rotate(-3 708 454)">项目预算</text></g>
<!-- 铅笔虚线箭头 -->
<g filter="url(#pencil)" fill="none" stroke="#3E3C38" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
 <path d="M432 540 C350 586 302 700 300 850" stroke-dasharray="16 14" mask="url(#am)"/>
 <path id="ah" d="M274 822 L300 862 L324 820"/>
</g>
<!-- 大圆脸 -->
<g id="big">
 <path d="M296 1170 C210 1170 152 1110 152 1030 C152 948 214 888 294 888 C376 888 434 950 432 1030 C430 1112 372 1170 296 1170 Z" fill="#F6F3EA"/>
 <g filter="url(#pencil)" fill="none" stroke="#3E3C38" stroke-linecap="round" stroke-linejoin="round" stroke-width="5">
  <path class="bf" d="M296 888 C376 888 434 950 432 1030 C430 1112 372 1170 296 1170 C210 1170 152 1110 152 1030 C152 948 214 888 300 890"/>
  <path class="bfe" d="M236 1010 q12 -14 24 0 M330 1010 q12 -14 24 0" stroke-width="5"/>
  <path id="bm1" d="M250 1076 q46 34 92 0" stroke-width="4.5"/>
  <g id="bm2" opacity="0"><ellipse cx="296" cy="1086" rx="18" ry="22" stroke-width="4.5"/><path d="M412 960 C424 980 424 996 412 998 C400 996 400 980 412 960 Z" stroke-width="3.5"/></g>
 </g>
 <path id="bh" d="M190 1060 C200 1100 230 1130 262 1144 L270 1126 C240 1110 214 1086 206 1056 Z" fill="url(#hatch)" opacity=".5" filter="url(#pencil)"/>
</g>
<!-- 小圆脸们 -->
<g id="smalls"></g>
<g id="coins"></g>
<g filter="url(#pen)">
 <text id="lb1" x="292" y="1266" text-anchor="middle" font-size="46" font-weight="700" fill="#34322E" transform="rotate(-2 292 1266)">方案 A</text>
 <text id="lb2" x="810" y="1286" text-anchor="middle" font-size="46" font-weight="700" fill="#34322E" transform="rotate(-2 810 1286)">方案 B</text>
</g>
<path id="ul" d="" fill="none" stroke="#07C160" stroke-width="6" stroke-linecap="round" filter="url(#pen)"/>
</g></svg>
<script>
var D=6.7; SK.page(document.getElementById('sv'));
var S=document.getElementById('smalls'),NS='http://www.w3.org/2000/svg';
var faces=[[680,960],[812,926],[934,968],[742,1088],[880,1098]];
faces.forEach(function(f,i){var x=f[0],y=f[1],r=48;
 S.insertAdjacentHTML('beforeend','<g transform="translate('+x+' '+y+')"><g class="sf">'+
 '<circle r="'+r+'" fill="#F6F3EA"/>'+
 (i==1?'<path d="M-48 -18 C-42 -66 42 -66 48 -18 Z" fill="#07C160" filter="url(#pencil)"/>':'')+
 '<g filter="url(#pencil)" fill="none" stroke="#3E3C38" stroke-linecap="round" stroke-width="4"><circle r="'+r+'"/>'+
 '<circle cx="-15" cy="-4" r="3.5" fill="#3E3C38" stroke="none"/><circle cx="15" cy="-4" r="3.5" fill="#3E3C38" stroke="none"/>'+
 '<path class="m1" d="M-10 20 L10 20" stroke-width="3.5"/><path class="m2" d="M-17 14 q17 20 34 0" stroke-width="3.5" opacity="0"/></g></g></g>');
});
// 小硬币：落成一小堆
var C=document.getElementById('coins'),N=7,coins=[];
for(var i=0;i<N;i++){var g=document.createElementNS(NS,'g');
 g.innerHTML='<g filter="url(#pencil)"><circle r="21" fill="#07C160" stroke="#3E3C38" stroke-width="3"/></g><text y="10" text-anchor="middle" font-size="28" font-weight="700" fill="#F6F3EA">¥</text>';
 g.setAttribute('opacity','0');C.appendChild(g);coins.push(g);}
var pile=[[700,1186],[742,1190],[784,1186],[826,1190],[868,1186],[910,1190],[805,1158]];
// 下划线按实测
(function(){var t=document.getElementById('lb2'),b=t.getBBox(),y=b.y+b.height+4;
 var u=document.getElementById('ul');u.setAttribute('d','M'+(b.x-4)+' '+(y+3)+' C'+(b.x+70)+' '+(y-3)+' '+(b.x+b.width-70)+' '+(y+2)+' '+(b.x+b.width+8)+' '+(y-4));u.setAttribute('transform',t.getAttribute('transform'));})();
var tl=gsap.timeline({paused:true}); SK.boil(tl,D);
// 0.06 起：先把人画出来
tl.set('#big',{opacity:1},0);
SK.draw(tl,'.bf',0.06,0.5); SK.show(tl,'.bfe',0.5,0.15); SK.draw(tl,'#bm1',0.6,0.2); SK.show(tl,'#bh',0.6,0.2,.5);
tl.set('.sf',{scale:0},0);
document.querySelectorAll('.sf').forEach(function(f,i){tl.fromTo(f,{scale:0,svgOrigin:'0 48'},{scale:1,duration:.35,ease:'back.out(2)'},0.7+i*0.14);});
// 2.1 钱袋
SK.drop(tl,'#bag',2.0,0); SK.write(tl,'#lb0',2.2,0.6);
// 3.7 虚线箭头 → 方案 A
SK.draw(tl,'#amp',3.6,0.5); SK.draw(tl,'#ah',4.05,0.15); SK.write(tl,'#lb1',3.7,0.45);
// 4.7 硬币飞向中腰尾
SK.write(tl,'#lb2',4.7,0.5);
coins.forEach(function(c,i){var o={u:0},p0=[600,540],p1=[930,560],p2=pile[i],t0=4.7+i*0.15;
 tl.set(c,{opacity:1},t0);
 tl.to(o,{u:1,duration:.55,ease:'power1.in',onUpdate:function(){var u=o.u,a=(1-u)*(1-u),b=2*u*(1-u),d=u*u;
   c.setAttribute('transform','translate('+(a*p0[0]+b*p1[0]+d*p2[0])+' '+(a*p0[1]+b*p1[1]+d*p2[1])+') rotate('+(u*360)+')');}},t0);
});
// 小圆脸开心
tl.set('.m1',{opacity:0},5.2); tl.set('.m2',{opacity:1},5.2);
document.querySelectorAll('.sf').forEach(function(f,i){tl.to(f,{y:-12,duration:.12,yoyo:true,repeat:1,ease:'power1.out'},5.25+i*0.08);});
// 大圆脸傻眼
tl.set('#bm1',{opacity:0},5.0); tl.set('#bm2',{opacity:1},5.0);
SK.draw(tl,'#ul',5.7,0.3);
SK.mount(tl,D);
</script></body></html>
