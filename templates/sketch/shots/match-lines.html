<script>
var D=6.8; SK.page(document.getElementById('sv'));
var tl=gsap.timeline({paused:true}); SK.boil(tl,D);
var cam=SK.cam(tl,'#world',{cx:560,cy:590,s:1.15});
SK.draw(tl,'.fl',0.0,0.4); SK.draw(tl,'.dk',0.1,0.35,0.1); SK.draw(tl,'.sl',0.15,0.35);
SK.draw(tl,'.lp',0.3,0.35,0.15); SK.show(tl,'#scr',0.75,0.2,.25); SK.show(tl,'#dsh',0.6,0.2,.5);
SK.pop(tl,'#mA',0.25);
SK.write(tl,'#ai',0.85,0.35);
// 打字
tl.to('#arms',{y:-4,duration:.1,yoyo:true,repeat:9,ease:'steps(1)'},1.0);
// 2.2 转身比大拇指
tl.set('#manA',{opacity:0},2.1); tl.set('#manB',{opacity:1},2.1);
tl.fromTo('#mB',{scale:.85,transformOrigin:'50% 100%'},{scale:1,duration:.3,ease:'back.out(3)'},2.1);
SK.draw(tl,'.sp',2.3,0.15);
SK.write(tl,'#lh',2.3,0.45);
tl.to('#mB',{rotation:-5,transformOrigin:'50% 100%',duration:.15,yoyo:true,repeat:3,ease:'steps(2)'},3.4);
// 5.2 拉开到下半
cam.to({cx:540,cy:900,s:1.0},0.6,'power2.inOut',4.65);
SK.drop(tl,'#cd1',4.95,-3); SK.drop(tl,'#cd2',5.05,2); SK.drop(tl,'#cd3',5.15,-2);
SK.pop(tl,'#fc1',5.0); SK.pop(tl,'#fc2',5.1); SK.pop(tl,'#fc3',5.2);
SK.draw(tl,'.ln1',5.25,0.25); SK.draw(tl,'.ln2',5.65,0.25); SK.draw(tl,'.ln3',6.05,0.25);
SK.mount(tl,D);
</script></body></html>
