<script>
var D=6.3; SK.page(document.getElementById('sv'));
var tl=gsap.timeline({paused:true}); SK.boil(tl,D);
var cam=SK.cam(tl,'#world',{cx:420,cy:820,s:1.22});
SK.write(tl,'.t1',0.05,0.45,0.3);
SK.draw(tl,'.ul',0.7,0.25);
SK.draw(tl,'.gr',0.2,0.4); SK.draw(tl,'.wall',0.3,0.45); SK.draw(tl,'.brick',0.55,0.3,0.06);
SK.show(tl,'#wh',0.75,0.25,.55);
SK.show(tl,'#hang',0.55,0.2); SK.write(tl,'#l0',0.8,0.3);
tl.set('#hang',{opacity:0},1.15);
tl.set('#walker',{x:262,y:858,opacity:0},0); tl.set('#walker',{opacity:1},1.15);
tl.fromTo('#stand',{y:30},{y:0,duration:.3,ease:'back.out(2)'},1.15);
cam.to({cx:560,cy:1020,s:1.08},0.8,'power2.inOut',1.4);
SK.draw(tl,'.st1',1.55,0.3);
tl.to('#walker',{keyframes:[{x:340,y:780,duration:.22,ease:'power1.out'},{x:420,y:1260,duration:.3,ease:'power2.in'}]},1.75);
SK.draw(tl,'.st2',2.2,0.35); SK.draw(tl,'.st3',2.5,0.45);
cam.to({cx:560,cy:960,s:1.0},1.0,'power2.inOut',2.3);
tl.to('#walker',{keyframes:[{x:560,y:1110,duration:.22,ease:'power1.out'},{x:620,y:1140,duration:.2,ease:'power2.in'}]},2.75);
tl.to('#walker',{keyframes:[{x:740,y:900,duration:.25,ease:'power1.out'},{x:840,y:940,duration:.22,ease:'power2.in'}]},3.3);
SK.show(tl,'#gh',3.6,0.3,.75);
SK.write(tl,'#l2',3.6,0.3);
SK.write(tl,'#n2',3.95,0.4); SK.draw(tl,'.c1',4.35,0.3,0.12);
SK.write(tl,'#l3',4.6,0.4); SK.draw(tl,'.c2',5.0,0.3);
tl.to('#stand',{rotation:-8,transformOrigin:'0 0',duration:.15,yoyo:true,repeat:3,ease:'steps(2)'},4.5);
SK.mount(tl,D);
</script></body></html>
